apiVersion: v1
kind: Namespace
metadata:
  name: office-lab
  labels:
    purpose: isolated-office-test
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-quota
  namespace: office-lab
spec:
  hard:
    requests.cpu: '2'
    limits.cpu: '6'
    requests.memory: 3Gi
    limits.memory: 8Gi
    requests.storage: 5Gi
    pods: '8'
    services: '5'
    requests.ephemeral-storage: 3Gi
    limits.ephemeral-storage: 12Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lab-limits
  namespace: office-lab
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 256Mi
      ephemeral-storage: 1Gi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 128Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wopi-data
  namespace: office-lab
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-source
  namespace: office-lab
data:
  wopi_server.py: "import os, json, hashlib, threading, time, urllib.parse, urllib.request,\
    \ html, zipfile, io, hmac\nfrom http.cookies import SimpleCookie, CookieError\n\
    from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler\nfrom pathlib\
    \ import Path\n\nDATA = Path('/data'); DATA.mkdir(exist_ok=True)\nKEY = os.environ['LAB_KEY'].strip()\n\
    TOKENS = {hashlib.sha256((KEY+u).encode()).hexdigest(): u for u in ('Alice','Bob')}\n\
    LOCK = threading.RLock()\nlocks = {}\nFILE = DATA/'collaboration.docx'\nif not\
    \ FILE.exists():\n    with zipfile.ZipFile(FILE,'w') as z:\n        z.writestr('[Content_Types].xml','<Types\
    \ xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\"><Default\
    \ Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"\
    /><Default Extension=\"xml\" ContentType=\"application/xml\"/><Override PartName=\"\
    /word/document.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml\"\
    /></Types>')\n        z.writestr('_rels/.rels','<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\"\
    ><Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\"\
    \ Target=\"word/document.xml\"/></Relationships>')\n        z.writestr('word/document.xml','<w:document\
    \ xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\"><w:body><w:p><w:r><w:t>Office\
    \ Lab Collaboration Test</w:t></w:r></w:p><w:p><w:r><w:t>\u4E2D\u6587\u6587\u6863\
    \u8F6C\u6362\u9A8C\u8BC1\uFF1A\u534F\u540C\u529E\u516C\u3002</w:t></w:r></w:p><w:sectPr/></w:body></w:document>')\n\
    \nclass Handler(BaseHTTPRequestHandler):\n    def authenticated(self, query=None):\n\
    \        values=[]\n        auth=self.headers.get('Authorization','')\n      \
    \  if auth.startswith('Bearer '): values.append(auth[7:].strip())\n        try:\n\
    \            cookies=SimpleCookie(self.headers.get('Cookie',''))\n           \
    \ if 'office_session' in cookies: values.append(cookies['office_session'].value)\n\
    \        except CookieError: pass\n        if query is not None: values.extend(query.get('key',[]))\n\
    \        return any(hmac.compare_digest(value.encode(),KEY.encode()) for value\
    \ in values)\n    def cookie_headers(self):\n        secure='; Secure' if self.headers.get('Host','').split(':')[0]=='office.cocolian.cn'\
    \ or self.headers.get('X-Forwarded-Proto')=='https' else ''\n        return {'Set-Cookie':'office_session='+KEY+';\
    \ Path=/; HttpOnly; SameSite=Lax; Max-Age=14400'+secure,'Location':'/'}\n    def\
    \ login_page(self, error=''):\n        return '''<!doctype html><html lang=\"\
    zh-CN\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\
    ><title>Office \u6587\u6863\u670D\u52A1</title></head><body style=\"font:16px\
    \ system-ui;max-width:720px;margin:60px auto;padding:24px\"><h1>Office \u6587\u6863\
    \u670D\u52A1</h1><p>\u8BF7\u8F93\u5165\u8BBF\u95EE\u5BC6\u94A5\uFF0C\u4F7F\u7528\
    \u5728\u7EBF\u7F16\u8F91\u548C\u6587\u6863\u8F6C\u6362\u3002</p><p>'''+html.escape(error)+'''</p><form\
    \ action=\"/login\" method=\"post\"><input type=\"password\" name=\"key\" required\
    \ autocomplete=\"current-password\" aria-label=\"\u8BBF\u95EE\u5BC6\u94A5\" style=\"\
    width:320px;padding:10px\"><button type=\"submit\" style=\"padding:10px\">\u767B\
    \u5F55</button></form></body></html>'''\n    def log_message(self, fmt, *args):\n\
    \        # Never log bearer tokens or the lab entry key.\n        print(json.dumps({'time':time.time(),'method':self.command,'path':urllib.parse.urlsplit(self.path).path,'message':fmt.split('%')[0]}),\
    \ flush=True)\n    def reply(self, code, data=b'', kind='application/json', headers=None):\n\
    \        if isinstance(data,dict): data=json.dumps(data).encode()\n        if\
    \ isinstance(data,str): data=data.encode()\n        self.send_response(code);\
    \ self.send_header('Content-Type',kind); self.send_header('Content-Length',str(len(data)))\n\
    \        self.send_header('Cache-Control','no-store')\n        for k,v in (headers\
    \ or {}).items(): self.send_header(k,v)\n        self.end_headers()\n        if\
    \ self.command!='HEAD': self.wfile.write(data)\n    def do_HEAD(self):\n     \
    \   self.do_GET()\n    def do_GET(self):\n        p=urllib.parse.urlsplit(self.path);\
    \ q=urllib.parse.parse_qs(p.query)\n        if p.path=='/health': return self.reply(200,{'status':'ok'})\n\
    \        if p.path=='/auth':\n            return self.reply(204 if self.authenticated()\
    \ else 401,b'',headers={'WWW-Authenticate':'Bearer realm=\"office-lab\"'})\n \
    \       if p.path.startswith('/wopi/files/1'):\n            user=TOKENS.get(q.get('access_token',[''])[0])\n\
    \            if not user: return self.reply(401)\n            with LOCK:\n   \
    \             if p.path.endswith('/contents'): return self.reply(200,FILE.read_bytes(),'application/vnd.openxmlformats-officedocument.wordprocessingml.document')\n\
    \                return self.reply(200,{'BaseFileName':FILE.name,'OwnerId':'lab','Size':FILE.stat().st_size,'UserId':user,'UserFriendlyName':user,'Version':str(FILE.stat().st_mtime_ns),'UserCanWrite':True,'SupportsUpdate':True,'SupportsLocks':True,'SupportsGetLock':True,'UserCanNotWriteRelative':True,'LastModifiedTime':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime(FILE.stat().st_mtime))})\n\
    \        if p.path=='/' and self.authenticated(q) and q.get('key'):\n        \
    \    return self.reply(303,b'',headers=self.cookie_headers())\n        if not\
    \ self.authenticated(q):\n            if p.path=='/': return self.reply(200,self.login_page(),'text/html;\
    \ charset=utf-8')\n            return self.reply(303,b'',headers={'Location':'/'})\n\
    \        if p.path=='/download': return self.reply(200,FILE.read_bytes(),'application/vnd.openxmlformats-officedocument.wordprocessingml.document')\n\
    \        if p.path=='/':\n            links=' '.join('<a target=\"_blank\" rel=\"\
    noopener\" href=\"/edit?user='+u+'\">'+u+' \u5728\u7EBF\u7F16\u8F91</a>' for u\
    \ in ('Alice','Bob'))\n            return self.reply(200,'<!doctype html><html\
    \ lang=\"zh-CN\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"\
    width=device-width,initial-scale=1\"><title>Office \u6587\u6863\u670D\u52A1</title></head><body\
    \ style=\"font:16px system-ui;max-width:720px;margin:60px auto;padding:24px\"\
    ><h1>Office \u6587\u6863\u670D\u52A1</h1><h2>\u5728\u7EBF\u7F16\u8F91</h2><p>'+links+'</p><p>\u4E24\
    \u4E2A\u7528\u6237\u5171\u540C\u7F16\u8F91\u540C\u4E00\u4EFD\u6D4B\u8BD5 DOCX\u3002\
    </p><p><a href=\"/download\">\u4E0B\u8F7D\u4FDD\u5B58\u540E\u7684 DOCX</a></p><h2>DOCX\
    \ \u8F6C PDF</h2><form action=\"/convert/forms/libreoffice/convert\" method=\"\
    post\" enctype=\"multipart/form-data\" target=\"_blank\"><input type=\"file\"\
    \ name=\"files\" accept=\".docx\" required><button type=\"submit\">\u8F6C\u6362\
    \u5E76\u4E0B\u8F7D PDF</button></form></body></html>','text/html; charset=utf-8')\n\
    \        if p.path=='/edit':\n            user=q.get('user',['Alice'])[0]\n  \
    \          if user not in ('Alice','Bob'): return self.reply(400)\n          \
    \  token=next(t for t,u in TOKENS.items() if u==user)\n            import xml.etree.ElementTree\
    \ as ET\n            discovery=ET.fromstring(urllib.request.urlopen('http://collabora:9980/hosting/discovery',timeout=10).read())\n\
    \            action=next(a for a in discovery.iter('action') if a.get('ext')=='docx'\
    \ and a.get('name')=='edit')\n            url=urllib.parse.urlsplit(action.get('urlsrc'))\n\
    \            src=url.path+'?WOPISrc='+urllib.parse.quote('http://wopi:8080/wopi/files/1',safe='')+'&lang=en-US'\n\
    \            page='<!doctype html><html><head><title>'+user+' Office Lab</title></head><body\
    \ style=\"margin:0\"><form id=\"f\" action=\"'+html.escape(src)+'\" method=\"\
    post\" target=\"editor\"><input type=\"hidden\" name=\"access_token\" value=\"\
    '+token+'\"><input type=\"hidden\" name=\"access_token_ttl\" value=\"0\"></form><iframe\
    \ title=\"Collabora '+user+'\" name=\"editor\" style=\"border:0;width:100vw;height:100vh\"\
    \ allow=\"clipboard-read; clipboard-write\"></iframe><script>document.getElementById(\"\
    f\").submit()</script></body></html>'\n            return self.reply(200,page,'text/html')\n\
    \        return self.reply(404)\n    def do_POST(self):\n        p=urllib.parse.urlsplit(self.path);\
    \ q=urllib.parse.parse_qs(p.query)\n        if p.path=='/login':\n           \
    \ length=int(self.headers.get('Content-Length','0'))\n            if length>4096:return\
    \ self.reply(413)\n            values=urllib.parse.parse_qs(self.rfile.read(length).decode(errors='replace'))\n\
    \            if self.authenticated(values):return self.reply(303,b'',headers=self.cookie_headers())\n\
    \            return self.reply(401,self.login_page('\u8BBF\u95EE\u5BC6\u94A5\u65E0\
    \u6548\uFF0C\u8BF7\u91CD\u8BD5\u3002'),'text/html; charset=utf-8')\n        if\
    \ not p.path.startswith('/wopi/files/1'): return self.reply(404)\n        if not\
    \ TOKENS.get(q.get('access_token',[''])[0]): return self.reply(401)\n        length=int(self.headers.get('Content-Length','0'))\n\
    \        if length>20*1024*1024: return self.reply(413)\n        body=self.rfile.read(length)\n\
    \        op=self.headers.get('X-WOPI-Override',''); new=self.headers.get('X-WOPI-Lock','')\n\
    \        with LOCK:\n            old, expiry=locks.get('1',('',0)); old=old if\
    \ expiry>time.time() else ''\n            def conflict(): return self.reply(409,b'',headers={'X-WOPI-Lock':old})\n\
    \            if p.path.endswith('/contents'):\n                if old and old!=new:\
    \ return conflict()\n                temp=DATA/'upload.tmp'; temp.write_bytes(body);\
    \ temp.replace(FILE)\n                print(json.dumps({'event':'PutFile','bytes':len(body),'version':FILE.stat().st_mtime_ns}),flush=True)\n\
    \                return self.reply(200,b'',headers={'X-WOPI-ItemVersion':str(FILE.stat().st_mtime_ns)})\n\
    \            if op=='GET_LOCK': return self.reply(200,b'',headers={'X-WOPI-Lock':old})\n\
    \            if op in ('LOCK','REFRESH_LOCK'):\n                expected=self.headers.get('X-WOPI-OldLock',new)\n\
    \                if old and old!=expected: return conflict()\n               \
    \ if op=='REFRESH_LOCK' and not old: return conflict()\n                locks['1']=(new,time.time()+1800);\
    \ return self.reply(200)\n            if op=='UNLOCK':\n                if old!=new:\
    \ return conflict()\n                locks.pop('1',None); return self.reply(200)\n\
    \            return self.reply(501)\n\nThreadingHTTPServer(('0.0.0.0',8000),Handler).serve_forever()\n"
  nginx.conf: "pid /tmp/nginx.pid;\nevents {}\nhttp {\n log_format safe '$remote_addr\
    \ \"$request_method $uri\" $status';\n access_log /dev/stdout safe; error_log\
    \ /dev/stderr warn;\n client_body_temp_path /tmp/client; proxy_temp_path /tmp/proxy;\n\
    \ fastcgi_temp_path /tmp/fastcgi; uwsgi_temp_path /tmp/uwsgi; scgi_temp_path /tmp/scgi;\n\
    \ map $http_upgrade $connection_upgrade { default upgrade; '' close; }\n server\
    \ { listen 8080; client_max_body_size 20m;\n location ~ ^/(browser|cool|hosting|lool)\
    \ { proxy_pass http://collabora:9980; proxy_http_version 1.1; proxy_set_header\
    \ Host $http_host; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection\
    \ $connection_upgrade; proxy_read_timeout 3600s; proxy_buffering off; }\n location\
    \ = /auth { return 404; }\n location = /_convert_auth { internal; proxy_pass http://127.0.0.1:8000/auth;\
    \ proxy_pass_request_body off; proxy_set_header Content-Length \"\"; proxy_set_header\
    \ Authorization $http_authorization; proxy_set_header Cookie $http_cookie; }\n\
    \ location /convert/ { auth_request /_convert_auth; proxy_pass http://libreoffice:3000/;\
    \ proxy_set_header Host $http_host; proxy_request_buffering off; proxy_read_timeout\
    \ 130s; }\n location / { proxy_pass http://127.0.0.1:8000; proxy_set_header Host\
    \ $http_host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }\n\
    \ }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabora
  namespace: office-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: collabora
  template:
    metadata:
      labels:
        app: collabora
    spec:
      automountServiceAccountToken: false
      containers:
      - name: collabora
        image: docker.io/collabora/code@sha256:87067a2f52aa8ad392725ffd6f6f210589d45f734fedc1b4519c7c654f44f587
        imagePullPolicy: Never
        ports:
        - containerPort: 9980
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 128Mi
          limits:
            cpu: '2'
            memory: 3Gi
            ephemeral-storage: 3Gi
        env:
        - name: aliasgroup1
          value: http://wopi:8080
        - name: extra_params
          value: --o:ssl.enable=false --o:ssl.termination=true --o:server_name=office.cocolian.cn:443
            --o:net.frame_ancestors=https://office.cocolian.cn --o:logging.level=warning
            --o:security.capabilities=false --o:child_root_path=/tmp/coolwsd-child-roots
            --o:cache_files.path=/tmp/coolwsd-cache
        readinessProbe:
          httpGet:
            path: /hosting/discovery
            port: 9980
          initialDelaySeconds: 10
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /hosting/discovery
            port: 9980
          failureThreshold: 60
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: libreoffice
  namespace: office-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: libreoffice
  template:
    metadata:
      labels:
        app: libreoffice
    spec:
      automountServiceAccountToken: false
      containers:
      - name: libreoffice
        image: docker.io/gotenberg/gotenberg@sha256:3fdee07e0dcd5005c3db4d81d1600d081fc6fb424da87e409e1c1f9624a249b8
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 128Mi
          limits:
            cpu: '2'
            memory: 3Gi
            ephemeral-storage: 3Gi
        args:
        - gotenberg
        - --api-timeout=120s
        - --libreoffice-auto-start=true
        - --chromium-disable-routes=true
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wopi
  namespace: office-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wopi
  template:
    metadata:
      labels:
        app: wopi
      annotations:
        office-lab/config-sha256: e9329cb9220b50b8aa03811d6114c57664bdcc505014435d66e766f17bce7e6a
    spec:
      automountServiceAccountToken: false
      containers:
      - name: wopi
        image: docker.io/library/python@sha256:2b4f19dae3a777dfc3b76730bda1e82e1f66ab2a2686fa93ca78edbfb4f04ffe
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
            ephemeral-storage: 3Gi
        command:
        - python
        - /app/wopi_server.py
        env:
        - name: LAB_KEY
          valueFrom:
            secretKeyRef:
              name: lab-auth
              key: key
        volumeMounts:
        - name: source
          mountPath: /app
          readOnly: true
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      - name: gateway
        image: docker.io/library/nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 250m
            memory: 128Mi
            ephemeral-storage: 3Gi
        command:
        - nginx
        - -c
        - /config/nginx.conf
        - -g
        - daemon off;
        volumeMounts:
        - name: source
          mountPath: /config
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: source
        configMap:
          name: lab-source
      - name: data
        persistentVolumeClaim:
          claimName: wopi-data
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: collabora
  namespace: office-lab
spec:
  selector:
    app: collabora
  ports:
  - port: 9980
    targetPort: 9980
---
apiVersion: v1
kind: Service
metadata:
  name: libreoffice
  namespace: office-lab
spec:
  selector:
    app: libreoffice
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: wopi
  namespace: office-lab
spec:
  selector:
    app: wopi
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-isolation
  namespace: office-lab
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: office
  namespace: office-lab
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
    nginx.ingress.kubernetes.io/whitelist-source-range: 192.168.99.1/32
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-request-buffering: 'off'
    nginx.ingress.kubernetes.io/enable-access-log: 'false'
spec:
  ingressClassName: nginx
  rules:
  - host: office.cocolian.cn
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wopi
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: office-ingress
  namespace: office-lab
spec:
  podSelector:
    matchLabels:
      app: wopi
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
