log_format office_lab '$remote_addr $time_iso8601 "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name office.cocolian.cn;
    access_log /var/log/nginx/office.cocolian.cn.access.log office_lab;
    return 301 https://office.cocolian.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name office.cocolian.cn;
    ssl_certificate /etc/letsencrypt/live/cocolian.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cocolian.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/office.cocolian.cn.access.log office_lab;
    error_log /var/log/nginx/office.cocolian.cn.error.log warn;
    client_max_body_size 20m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://192.168.99.2:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
