apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-developer
  namespace: office-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codex-dev-observer
rules:
- apiGroups: [""]
  resources: [pods, pods/log, events, services, endpoints, namespaces, nodes, resourcequotas, limitranges, persistentvolumeclaims, persistentvolumes]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, replicasets, statefulsets, daemonsets]
  verbs: [get, list, watch]
- apiGroups: [batch]
  resources: [jobs, cronjobs]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [ingresses, networkpolicies]
  verbs: [get, list, watch]
- apiGroups: [metrics.k8s.io]
  resources: [nodes, pods]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codex-dev-observer
subjects:
- kind: ServiceAccount
  name: codex-developer
  namespace: office-lab
roleRef:
  kind: ClusterRole
  name: codex-dev-observer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-dev-publisher
  namespace: office-lab
rules:
- apiGroups: [""]
  resources: [pods, pods/log, configmaps, services, endpoints, events]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [pods/exec, pods/portforward]
  verbs: [create, get]
- apiGroups: [apps]
  resources: [deployments, replicasets, statefulsets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [batch]
  resources: [jobs, cronjobs]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [networking.k8s.io]
  resources: [ingresses, networkpolicies]
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codex-dev-publisher
  namespace: office-lab
subjects:
- kind: ServiceAccount
  name: codex-developer
  namespace: office-lab
roleRef:
  kind: Role
  name: codex-dev-publisher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: codex-dev-api-token
  namespace: office-lab
  annotations:
    kubernetes.io/service-account.name: codex-developer
type: kubernetes.io/service-account-token
